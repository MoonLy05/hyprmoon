
# 1. Importamos los colores dinámicos que Matugen generó para Hyprland
source = ~/.config/hyprlock/colors-matugen.conf


# 2. FONDO
background {
    monitor =
    path = screenshot
    blur_passes = 2    
    blur_size = 5
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.4
    vibrancy_darkness = 0.0
}

# 3. HORA
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H")</b>"
    color = $on_primary_container
    font_size = 120
    font_family = CaskaydiaCove Nerd Font
    position = 100, 300
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# 4. Minutos
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%M")</b>"
    color = $on_surface
    font_size = 120
    font_family = CaskaydiaCove Nerd Font
    position = 100, 145
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# 5. FECHA
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%A, %d de %B")</b>"
    color = $primary
    font_size = 30
    font_family = CaskaydiaCove Nerd Font
    position = 100, 30
    halign = left
    valign = center
}

# 6. USUARIO ACTUAL
label {
    monitor =
    text =   $USER
    color = $on_surface
    font_size = 22
    font_family = CaskaydiaCove Nerd Font
    position = 100, -40
    halign = left
    valign = center
}

# 7. Foto de usuario
image {
    monitor =
    path = ~/.face
    size = 60 
    rounding = -1
    border_size = 3
    border_color = $primary
    rotate = 0
    
    position = 100, -120
    halign = left
    valign = center
}

# 8. CAJA DE CONTRASEÑA
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    fade_on_empty = false
    font_family = CaskaydiaCove Nerd Font
    placeholder_text = 🌸 Contraseña...
    hide_input = false
    position = 190, -120
    halign = left
    valign = center
    capslock_color = $error
    fail_text = Intento número $ATTEMPTS
    rounding = -1
}

# 9. Layout KB
label {
    monitor =
    text = $LAYOUT
    color = $primary
    font_size = 16
    font_family = CaskaydiaCove Nerd Font
    position = 516, -120
    halign = left
    valign = center
}

# 10. BATERÍA DIRECTA DEL SISTEMA
label {
    monitor =
    text = cmd[update:5000] echo "<b>󰁹 $(cat /sys/class/power_supply/BAT*/capacity)%</b>"
    color = $secondary
    font_size = 20
    font_family = CaskaydiaCove Nerd Font
    position = -50, -30
    halign = right
    valign = top
}

# 11. CANCIÓN ACTUAL
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hyprlock/Scripts/songdetail.sh)" 
    color = $secondary
    font_size = 16
    font_family = CaskaydiaCove Nerd Font
    position = -60, 35
    halign = right
    valign = bottom
}

# 12. PORTADA DEL ÁLBUM 
image {
    monitor =
    path = ~/.config/hyprlock/headset_logo.png
    size = 180 # Tamaño del cuadrito del álbum
    rounding = 15
    border_size = 3
    border_color = $secondary
    rotate = 0
    
    reload_time = 2
    reload_cmd = ~/.config/hyprlock/Scripts/album_art.sh
    
    position = -50, 100
    halign = right
    valign = bottom
}